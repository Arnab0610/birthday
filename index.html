<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>শুভ জন্মদিন পুষ্পিতা! 🌻✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;700;800&family=Fraunces:wght@700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Anek Bangla', sans-serif;
      background: radial-gradient(circle at center, #fffaf2 0%, #fde7cb 65%, #f6c89a 100%);
      color: #4a261b;
      user-select: none;
    }

    #rainCanvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 1; pointer-events: none;
    }

    .birthday-viewport {
      position: relative; z-index: 2;
      width: 100%; height: 100dvh;
      display: flex; flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(8px, 1.8vh, 16px) 12px 10px;
      text-align: center;
    }

    /* Top Celebration Title */
    .title-area {
      flex-shrink: 0;
      margin-top: 2px;
    }
    .bday-title {
      font-family: 'Fraunces', serif;
      font-size: clamp(20px, 5.2vw, 34px);
      font-weight: 900;
      color: #bf360c;
      text-shadow: 0 2px 8px rgba(255, 255, 255, 0.9);
      line-height: 1.2;
    }
    .bday-sub {
      font-size: clamp(12px, 2.6vw, 15px);
      font-weight: 600;
      color: #8d4024;
      margin-top: 3px;
    }

    /* Middle Scene: Arnab (Left) + Letter Scroll (Center) + Pushpita (Right) */
    .story-stage {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
      max-width: 650px;
      margin: auto 0;
      flex: 1;
      max-height: 72vh;
      gap: clamp(6px, 1.5vw, 15px);
    }

    /* Characters Box */
    .char-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      max-width: clamp(85px, 22vw, 135px);
      position: relative;
      z-index: 5;
    }

    .char-img {
      width: 100%;
      height: auto;
      filter: drop-shadow(0 8px 18px rgba(180, 80, 20, 0.28));
      transform-origin: center bottom;
    }

    .arnab-reading {
      animation: arnabNarrate 3s ease-in-out infinite alternate;
    }
    .pushpita-listening {
      animation: pushpitaSmile 3.2s ease-in-out infinite alternate;
    }

    .char-tag {
      font-size: clamp(10px, 2vw, 12px);
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 4px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .tag-arnab { background: #e1f5fe; color: #0277bd; border: 1px solid #81d4fa; }
    .tag-pushpita { background: #fff8e1; color: #f57f17; border: 1px solid #ffe082; }

    /* Center Letter Scroll / Wishing Card */
    .wish-scroll-card {
      flex: 2;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid #ffb300;
      border-radius: 18px;
      padding: clamp(10px, 2vh, 18px) clamp(10px, 2.5vw, 16px);
      box-shadow: 0 10px 24px -5px rgba(180, 80, 20, 0.18);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 180px;
      max-height: 52vh;
      margin-bottom: 15px;
    }

    .card-top-icon {
      font-size: clamp(18px, 4vw, 24px);
      margin-bottom: 4px;
    }

    .card-head {
      font-size: clamp(13px, 3vw, 17px);
      font-weight: 700;
      color: #b73812;
      margin-bottom: 8px;
    }

    /* Wish Typewriter Text Area */
    .wish-text-content {
      font-size: clamp(12px, 2.8vw, 15px);
      line-height: 1.5;
      color: #3e2723;
      text-align: center;
      font-weight: 600;
      min-height: 90px;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 14px;
      background-color: #bf360c;
      margin-left: 2px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Footer Note */
    .footer-bar {
      flex-shrink: 0;
      font-size: clamp(10px, 2.2vw, 12px);
      font-style: italic;
      color: #6d4c41;
      margin-top: 4px;
    }

    /* Animations */
    .char-speaking {
      animation: talkBounce 0.35s ease-in-out infinite alternate !important;
    }
    @keyframes talkBounce {
      0% { transform: scale(1); }
      100% { transform: scale(1.04) translateY(-2px); }
    }
    @keyframes arnabNarrate {
      0% { transform: translateY(0) rotate(0.5deg); }
      100% { transform: translateY(-4px) rotate(-0.5deg); }
    }
    @keyframes pushpitaSmile {
      0% { transform: translateY(0) rotate(-0.5deg); }
      100% { transform: translateY(-5px) rotate(0.8deg); }
    }
  </style>
</head>
<body>

  <canvas id="rainCanvas"></canvas>

  <div class="birthday-viewport">
    <!-- Header -->
    <div class="title-area">
      <h1 class="bday-title">🌻 শুভ জন্মদিন পুষ্পিতা! 🎂✨</h1>
      <p class="bday-sub">একমুঠো সোনালী সূর্যমুখী আর একরাশ শুভকামনা</p>
    </div>

    <!-- Center Stage: Arnab (Left) + Wish Card (Center) + Pushpita (Right) -->
    <div class="story-stage">
      <!-- Arnab -->
      <div class="char-side">
        <div class="char-tag tag-arnab">অর্ণব 🎙️</div>
        <img src="./arnab-character.png" alt="Arnab" class="char-img arnab-reading" id="arnabSpeaker" />
      </div>

      <!-- Center Wishing Scroll Card -->
      <div class="wish-scroll-card">
        <div class="card-top-icon">📜🌻</div>
        <div class="card-head">✦ অর্ণবের তরফ থেকে একটা ছোট্ট উইশ ✦</div>
        <div class="wish-text-content">
          <span id="typedWish"></span><span class="cursor" id="cursor"></span>
        </div>
      </div>

      <!-- Pushpita -->
      <div class="char-side">
        <div class="char-tag tag-pushpita">পুষ্পিতা 💛</div>
        <img src="./WhatsApp_Image_2026-10-08_at_7.51.43_PM-removebg-preview.png" alt="Pushpita" class="char-img pushpita-listening" id="pushpitaListener" />
      </div>
    </div>

    <!-- Footer Signature -->
    <div class="footer-bar">
      Crafted with ❤️ by Arnab for Pushpita's Special Day ✨
    </div>
  </div>

  <script type="module" src="./main.js"></script>

  <script>
    // 1. Initial Grand Confetti Blast
    window.addEventListener('load', () => {
      triggerConfetti();
      setTimeout(triggerConfetti, 600);
      setTimeout(startReadingWish, 1200);
    });

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 90,
          spread: 75,
          origin: { y: 0.6 },
          colors: ['#ffb300', '#ff6f00', '#ffd54f', '#0288d1', '#e91e63']
        });
      }
    }

    // 2. Heartfelt Bengali Wish Lines
    const fullWish = "পুষ্পিতা, তোর চব্বিশতম জন্মদিনটা হোক এক আকাশ রোদ্দুর আর একরাশ সুর্যমুখীর মতো স্নিগ্ধ ও সুন্দর। জীবনের নতুন এই ধাপে তোর সব স্বপ্ন সত্যি হোক, প্রতিটা দিন ভরে উঠুক সাফল্য, শান্তি আর প্রাণখোলা হাসিতে। খুব ভালো থাকিস সব সময়! শুভ জন্মদিন! 🌻🎂💛";

    const typedElem = document.getElementById('typedWish');
    const arnabImg = document.getElementById('arnabSpeaker');
    const cursor = document.getElementById('cursor');

    function startReadingWish() {
      let charIdx = 0;
      // Arnab pore shonanor bhabe bounce/talk animation korbe
      if (arnabImg) arnabImg.classList.add('char-speaking');

      const typingTimer = setInterval(() => {
        if (charIdx < fullWish.length) {
          typedElem.textContent += fullWish.charAt(charIdx);
          charIdx++;
        } else {
          clearInterval(typingTimer);
          if (arnabImg) arnabImg.classList.remove('char-speaking');
          cursor.style.display = 'none'; // Typing shesh hole cursor bondho
          
          // Sheshe arekbar celebration blast
          setTimeout(triggerConfetti, 400);
        }
      }, 50); // Reading/Typing speed
    }
  </script>
</body>
</html>
