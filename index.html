<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>শুভ চব্বিশতম জন্মদিন পুষ্পিতা! 🌻✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;700;800&family=Fraunces:wght@700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Anek Bangla', sans-serif;
      background: radial-gradient(circle at center, #fffaf2 0%, #fde7cb 65%, #f6c89a 100%);
      color: #4a261b;
      user-select: none;
    }

    #rainCanvas, #fireworksCanvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    #rainCanvas { z-index: 1; }
    #fireworksCanvas { z-index: 2; }

    /* Floating Balloons Layer */
    .balloon-layer {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 3; pointer-events: none; overflow: hidden;
    }
    .balloon {
      position: absolute;
      bottom: -120px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      opacity: 0.88;
      animation: floatUpward linear forwards;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,0.12));
    }
    .balloon::after {
      content: '';
      position: absolute;
      bottom: -14px; left: 50%;
      transform: translateX(-50%);
      width: 1.5px; height: 32px;
      background: rgba(120, 80, 50, 0.4);
    }
    @keyframes floatUpward {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.9; }
      90% { opacity: 0.9; }
      100% { transform: translateY(-115vh) rotate(16deg); opacity: 0; }
    }

    .birthday-viewport {
      position: relative; z-index: 5;
      width: 100%; height: 100dvh;
      display: flex; flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(8px, 1.8vh, 16px) 12px 10px;
      text-align: center;
    }

    /* Top Celebration Title */
    .title-area {
      flex-shrink: 0;
      margin-top: 2px;
    }
    .bday-title {
      font-family: 'Fraunces', serif;
      font-size: clamp(20px, 5.2vw, 34px);
      font-weight: 900;
      color: #bf360c;
      text-shadow: 0 2px 8px rgba(255, 255, 255, 0.9);
      line-height: 1.2;
    }
    .bday-sub {
      font-size: clamp(12px, 2.6vw, 15px);
      font-weight: 600;
      color: #8d4024;
      margin-top: 3px;
    }

    /* Middle Scene: Arnab (Left) + Letter Scroll (Center) + Pushpita (Right) */
    .story-stage {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
      max-width: 650px;
      margin: auto 0;
      flex: 1;
      max-height: 72vh;
      gap: clamp(6px, 1.5vw, 15px);
    }

    /* Characters Box */
    .char-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      max-width: clamp(85px, 22vw, 135px);
      position: relative;
      z-index: 5;
    }

    .char-img {
      width: 100%;
      height: auto;
      filter: drop-shadow(0 8px 18px rgba(180, 80, 20, 0.28));
      transform-origin: center bottom;
    }

    .arnab-reading {
      animation: arnabNarrate 3s ease-in-out infinite alternate;
    }
    .pushpita-listening {
      animation: pushpitaSmile 3.2s ease-in-out infinite alternate;
    }

    .char-tag {
      font-size: clamp(10px, 2vw, 12px);
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 4px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .tag-arnab { background: #e1f5fe; color: #0277bd; border: 1px solid #81d4fa; }
    .tag-pushpita { background: #fff8e1; color: #f57f17; border: 1px solid #ffe082; }

    /* Center Letter Scroll / Wishing Card */
    .wish-scroll-card {
      flex: 2;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid #ffb300;
      border-radius: 18px;
      padding: clamp(10px, 2vh, 18px) clamp(10px, 2.5vw, 16px);
      box-shadow: 0 10px 24px -5px rgba(180, 80, 20, 0.18);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 180px;
      max-height: 52vh;
      margin-bottom: 15px;
    }

    .card-top-icon {
      font-size: clamp(18px, 4vw, 24px);
      margin-bottom: 4px;
    }

    .card-head {
      font-size: clamp(13px, 3vw, 17px);
      font-weight: 700;
      color: #b73812;
      margin-bottom: 8px;
    }

    /* Wish Typewriter Text Area */
    .wish-text-content {
      font-size: clamp(12px, 2.8vw, 15px);
      line-height: 1.5;
      color: #3e2723;
      text-align: center;
      font-weight: 600;
      min-height: 90px;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 14px;
      background-color: #bf360c;
      margin-left: 2px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Footer Note */
    .footer-bar {
      flex-shrink: 0;
      font-size: clamp(10px, 2.2vw, 12px);
      font-style: italic;
      color: #6d4c41;
      margin-top: 4px;
    }

    /* Animations */
    .char-speaking {
      animation: talkBounce 0.35s ease-in-out infinite alternate !important;
    }
    @keyframes talkBounce {
      0% { transform: scale(1); }
      100% { transform: scale(1.04) translateY(-2px); }
    }
    @keyframes arnabNarrate {
      0% { transform: translateY(0) rotate(0.5deg); }
      100% { transform: translateY(-4px) rotate(-0.5deg); }
    }
    @keyframes pushpitaSmile {
      0% { transform: translateY(0) rotate(-0.5deg); }
      100% { transform: translateY(-5px) rotate(0.8deg); }
    }
  </style>
</head>
<body>

  <!-- Background Layer 1: Sunflowers -->
  <canvas id="rainCanvas"></canvas>

  <!-- Background Layer 2: Fireworks (Baaji) -->
  <canvas id="fireworksCanvas"></canvas>

  <!-- Background Layer 3: Rising Balloons -->
  <div class="balloon-layer" id="balloonLayer"></div>

  <div class="birthday-viewport">
    <!-- Header -->
    <div class="title-area">
      <h1 class="bday-title">🌻 শুভ ২৪তম জন্মদিন পুষ্পিতা! 🎂✨</h1>
      <p class="bday-sub">একমুঠো সোনালী সূর্যমুখী আর একরাশ শুভকামনা</p>
    </div>

    <!-- Center Stage: Arnab (Left) + Wish Card (Center) + Pushpita (Right) -->
    <div class="story-stage">
      <!-- Arnab -->
      <div class="char-side">
        <div class="char-tag tag-arnab">অর্ণব 🎙️</div>
        <img src="./arnab-character.png" alt="Arnab" class="char-img arnab-reading" id="arnabSpeaker" />
      </div>

      <!-- Center Wishing Scroll Card -->
      <div class="wish-scroll-card">
        <div class="card-top-icon">📜🌻</div>
        <div class="card-head">✦ অর্ণবের তরফ থেকে একটা ছোট্ট উইশ ✦</div>
        <div class="wish-text-content">
          <span id="typedWish"></span><span class="cursor" id="cursor"></span>
        </div>
      </div>

      <!-- Pushpita -->
      <div class="char-side">
        <div class="char-tag tag-pushpita">পুষ্পিতা 💛</div>
        <img src="./WhatsApp_Image_2026-10-08_at_7.51.43_PM-removebg-preview.png" alt="Pushpita" class="char-img pushpita-listening" id="pushpitaListener" />
      </div>
    </div>

    <!-- Footer Signature -->
    <div class="footer-bar">
      Crafted with ❤️ by Arnab for Pushpita's Special Day ✨
    </div>
  </div>

  <script type="module" src="./main.js"></script>

  <script>
    // ==========================================
    // 1. REALISTIC BAAJI / FIREWORKS ENGINE
    // ==========================================
    const fwCanvas = document.getElementById('fireworksCanvas');
    const fwCtx = fwCanvas.getContext('2d');
    let fwParticles = [];

    function resizeFwCanvas() {
      fwCanvas.width = window.innerWidth;
      fwCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeFwCanvas);
    resizeFwCanvas();

    class FireworkParticle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.015;
        this.gravity = 0.08;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.alpha -= this.decay;
      }
      draw() {
        fwCtx.save();
        fwCtx.globalAlpha = Math.max(0, this.alpha);
        fwCtx.fillStyle = this.color;
        fwCtx.shadowBlur = 8;
        fwCtx.shadowColor = this.color;
        fwCtx.beginPath();
        fwCtx.arc(this.x, this.y, 2.2, 0, Math.PI * 2);
        fwCtx.fill();
        fwCtx.restore();
      }
    }

    function createFirework(x, y) {
      const colors = ['#ffb300', '#ff3d00', '#ffd54f', '#00e5ff', '#ff4081', '#76ff03'];
      const chosenColor = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < 45; i++) {
        fwParticles.push(new FireworkParticle(x, y, chosenColor));
      }
    }

    function animateFireworks() {
      fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
      for (let i = fwParticles.length - 1; i >= 0; i--) {
        const p = fwParticles[i];
        p.update();
        p.draw();
        if (p.alpha <= 0) fwParticles.splice(i, 1);
      }
      requestAnimationFrame(animateFireworks);
    }
    animateFireworks();

    // Akashe majhe majhe baaji fatbe
    setInterval(() => {
      const rx = Math.random() * (fwCanvas.width * 0.8) + (fwCanvas.width * 0.1);
      const ry = Math.random() * (fwCanvas.height * 0.45) + (fwCanvas.height * 0.1);
      createFirework(rx, ry);
    }, 1800);


    // ==========================================
    // 2. RISING 3D BALLOONS GENERATOR
    // ==========================================
    const balloonLayer = document.getElementById('balloonLayer');
    const balloonGradients = [
      'radial-gradient(circle at 35% 35%, #ffd54f, #ff8f00)',
      'radial-gradient(circle at 35% 35%, #ff8a80, #d50000)',
      'radial-gradient(circle at 35% 35%, #80d8ff, #0091ea)',
      'radial-gradient(circle at 35% 35%, #b9f6ca, #00c853)',
      'radial-gradient(circle at 35% 35%, #ea80fc, #aa00ff)'
    ];

    function spawnBalloon() {
      if (!balloonLayer) return;
      const b = document.createElement('div');
      b.className = 'balloon';
      const size = 34 + Math.random() * 26; // 34px - 60px
      b.style.width = size + 'px';
      b.style.height = (size * 1.25) + 'px';
      b.style.left = (Math.random() * 92) + 'vw';
      b.style.background = balloonGradients[Math.floor(Math.random() * balloonGradients.length)];
      b.style.animationDuration = (8 + Math.random() * 5) + 's';

      balloonLayer.appendChild(b);
      setTimeout(() => b.remove(), 13000);
    }
    setInterval(spawnBalloon, 1000);
    for (let i = 0; i < 5; i++) setTimeout(spawnBalloon, i * 250);


    // ==========================================
    // 3. PARTY POPPER CORNER CANNONS BLAST
    // ==========================================
    function firePartyPoppers() {
      if (typeof confetti !== 'function') return;
      // Bamer corner popper
      confetti({
        particleCount: 50,
        angle: 60,
        spread: 55,
        origin: { x: 0, y: 0.85 },
        colors: ['#ffb300', '#ff1744', '#00e5ff', '#ffea00']
      });
      // Daaner corner popper
      confetti({
        particleCount: 50,
        angle: 120,
        spread: 55,
        origin: { x: 1, y: 0.85 },
        colors: ['#ffb300', '#ff1744', '#00e5ff', '#ffea00']
      });
    }

    // Proti 5 second por por subtle party popper blast
    setInterval(firePartyPoppers, 5500);


    // ==========================================
    // 4. INITIAL REVEAL & WISH TYPEWRITER
    // ==========================================
    window.addEventListener('load', () => {
      firePartyPoppers();
      createFirework(window.innerWidth * 0.3, window.innerHeight * 0.25);
      createFirework(window.innerWidth * 0.7, window.innerHeight * 0.22);
      setTimeout(startReadingWish, 1200);
    });

    const fullWish = "শুভ জন্মদিন পুষ্পিতা! তোর জীবনের এই নতুন বছরটা হোক একরাশ সোনালী সূর্যমুখীর মতোই উজ্জ্বল আর আনন্দময়। তোর সব চাওয়া সত্যি হোক, তোর মুখে এই মিষ্টি হাসিটা চিরকাল অমলিন থাকুক। নতুন এই বয়সে অনেক বড় হ, অনেক ভালো থাকিস সব সময়! শুভ জন্মদিন! 🌻✨🎉";

    const typedElem = document.getElementById('typedWish');
    const arnabImg = document.getElementById('arnabSpeaker');
    const cursor = document.getElementById('cursor');

    function startReadingWish() {
      let charIdx = 0;
      if (arnabImg) arnabImg.classList.add('char-speaking');

      const typingTimer = setInterval(() => {
        if (charIdx < fullWish.length) {
          typedElem.textContent += fullWish.charAt(charIdx);
          charIdx++;
          // Lekhar majhe majhe akashe baaji blast
          if (charIdx === 40 || charIdx === 90) {
            createFirework(window.innerWidth * (0.2 + Math.random() * 0.6), window.innerHeight * 0.2);
          }
        } else {
          clearInterval(typingTimer);
          if (arnabImg) arnabImg.classList.remove('char-speaking');
          cursor.style.display = 'none';
          
          // Sheshe grand celebration finale!
          firePartyPoppers();
          createFirework(window.innerWidth * 0.5, window.innerHeight * 0.2);
        }
      }, 50);
    }
  </script>
</body>
</html>
